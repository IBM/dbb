3-Create next release version:
    needs:
        - job: "2-Generate and publish deployment report for Production"
          artifacts: false
        - job: "Build application"
          artifacts: true
    stage: Deploy Production
    tags: [zos-native]
    rules:
        - if: $CI_COMMIT_BRANCH == "main" && $pipelineType == "release"
        - if: $CI_COMMIT_BRANCH =~ /release.*/ && $pipelineType == "release"
    script: |
            echo [INFO] "Start creating next release version"
            echo [INFO] Release Version: ${releaseVersion}

            export currentBaselineVersion=$(echo "${releaseVersion}" | awk -F "rel-" '{print $2}')
            currentBaselineVersion="rel-${currentBaselineVersion}"
            echo [INFO] Current Baseline Version: ${currentBaselineVersion}

            cd ${uniqueWorkspaceId}/${application}

            export remoteFound=`git remote | grep gitlab_origin | wc -l`
            if [ $remoteFound -eq 1 ]; then
                git remote remove gitlab_origin
            fi
            git remote add gitlab_origin ${CI_SERVER_PROTOCOL}://Automation:${AutomationToken}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${CI_PROJECT_PATH}.git

            # Update baselineRef.yaml
            baselineReferenceFile=$(find ${uniqueWorkspaceId} -name baselineRef.yaml)
            if [ -z "${baselineReferenceFile}" ]; then
                RC=8
                echo [ERROR] Unable to locate the baselineRef.yaml file. Exit code: ${RC}.
                exit ${RC}
            fi

            # Compute the next release version by incrementing releaseVersion (from dotenv) per releaseType
            baseVersion=$(echo "${releaseVersion}" | sed 's/^rel-//')
            case $(echo ${releaseType} | tr '[:upper:]' '[:lower:]') in
                "patch")
                    nextBaseVersion=$(echo ${baseVersion} | awk -F. -v OFS=. '{$3 += 1; print}') ;;
                "minor")
                    nextBaseVersion=$(echo ${baseVersion} | awk -F. -v OFS=. '{$2 += 1; $3 = 0; print}') ;;
                "major")
                    nextBaseVersion=$(echo ${baseVersion} | awk -F. -v OFS=. '{$1 += 1; $2 = 0; $3 = 0; print}') ;;
                *)
                    RC=8
                    echo [ERROR] Invalid releaseType: ${releaseType}. Exit code: ${RC}.
                    exit ${RC} ;;
            esac

            nextReleaseVersion="rel-${nextBaseVersion}"
            echo [INFO] Next Release Version: ${nextReleaseVersion}

            # Detect the encoding of the baselineRef.yaml file so edits round-trip
            # correctly regardless of whether the file is tagged UTF-8 or IBM-1047.
            # If the file is not IBM-1047, convert it first so that sed operates on
            # IBM-1047 bytes, then convert the result back to the original encoding.
            baselineRefEncoding=$(chtag -p "${baselineReferenceFile}" 2>/dev/null | awk '{ print $2 }' | tr '[:lower:]' '[:upper:]')
            case "${baselineRefEncoding}" in
                UTF-8 | UTF8 | ISO8859-1 | ISO88591) : ;;  # keep detected value
                *) baselineRefEncoding="IBM-1047" ;;        # untagged / binary – treat as IBM-1047
            esac
            echo [INFO] baselineRef.yaml encoding: ${baselineRefEncoding}

            # If the file is not already IBM-1047, convert it to a temporary IBM-1047
            # working copy so sed operates on consistent EBCDIC bytes.
            if [ "${baselineRefEncoding}" != "IBM-1047" ]; then
                iconv -f ${baselineRefEncoding} -t IBM-1047 ${baselineReferenceFile} > ${baselineReferenceFile}.work
            else
                cp ${baselineReferenceFile} ${baselineReferenceFile}.work
            fi

            if [ ${CI_COMMIT_BRANCH} == "main" ]; then
                echo [INFO] Update baselineRef.yaml to set baseline references for the branches main and release/${nextReleaseVersion}
                sed "s|main: \"refs/tags/${currentBaselineVersion}\"|main: \"refs/tags/${releaseVersion}\"|" ${baselineReferenceFile}.work > ${baselineReferenceFile}.new
                iconv -f ISO8859-1 -t ${baselineRefEncoding} ${baselineReferenceFile}.new > ${baselineReferenceFile}
                chtag -tc ${baselineRefEncoding} ${baselineReferenceFile}
                rm ${baselineReferenceFile}.work ${baselineReferenceFile}.new
                echo "  release/${nextReleaseVersion}: \"refs/tags/${nextReleaseVersion}\"" >> ${baselineReferenceFile}
            else
                echo [INFO] Update baselineRef.yaml to set baseline reference for branch release/${nextReleaseVersion}
                sed "s|release/${currentBaselineVersion}: \"refs/tags/${currentBaselineVersion}\"|release/${currentBaselineVersion}: \"refs/tags/${releaseVersion}\"|" ${baselineReferenceFile}.work > ${baselineReferenceFile}.new
                iconv -f ISO8859-1 -t ${baselineRefEncoding} ${baselineReferenceFile}.new > ${baselineReferenceFile}
                chtag -tc ${baselineRefEncoding} ${baselineReferenceFile}
                rm ${baselineReferenceFile}.work ${baselineReferenceFile}.new
            fi

            git add ${baselineReferenceFile}
            git commit -m "Updated baselineRef.yaml for new release ${releaseVersion}"
            git push gitlab_origin HEAD:${CI_COMMIT_BRANCH} -o ci.skip
            echo [INFO] Pushed baselineReference.config file changes to branch: ${CI_COMMIT_BRANCH}.

            # Create release tag
            curl --request POST --header "PRIVATE-TOKEN: ${AutomationToken}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags?tag_name=${releaseVersion}&ref=${CI_COMMIT_REF_NAME}"
            RC=$?

            if [ ${RC} -eq 0 ]; then
                echo [INFO] Created release version tag: ${releaseVersion}.
                if [ ${CI_COMMIT_BRANCH} == "main" ]; then
                    # Create release maintenance branch
                    curl --request POST --header "PRIVATE-TOKEN: ${AutomationToken}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/branches?branch=release%2F${nextReleaseVersion}&ref=${releaseVersion}"
                    RC=$?
                    if [ ${RC} -eq 0 ]; then
                        echo [INFO] Created release maintenance branch: release/${nextReleaseVersion}.
                    else
                        echo [ERROR] Failed to create release maintenance branch. Exit code: ${RC}.
                        exit ${RC}
                    fi  
                fi
            else
                echo [ERROR] Failed to create release candidate tag. Exit code: ${RC}.
                exit ${RC}
            fi
            
Cleanup:
    stage: Cleanup
    tags: [zos-native]
    variables:
      FF_ENABLE_JOB_CLEANUP: 1
    script: |
        deleteWorkspace.sh -w ${uniqueWorkspaceId}
        RC=$?
        if [ ${RC} -eq 0 ]; then
            echo [INFO] Cleanup job passed.
        else
             echo [ERROR] Cleanup job failed. Exit code: ${RC}.
             exit ${RC}
        fi
