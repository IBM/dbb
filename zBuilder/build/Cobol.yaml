####################################
# Cobol language configuration
#################################### 

version: 1.0.3
tasks:
  # Cobol Language task
  - language: Cobol

    # source file association patterns
    sources:
      - "**/cobol/*.cbl"
      
    # overridable variables
    variables:
      # conditional variable builds compile parameters i.e CICS,SQL
      - name: compileParms
        append:
          - condition: ${IS_CICS}
            value: CICS
          - condition: ${IS_SQL}
            value: SQL
          - condition: 
              exists: errPrefix
            value: ADATA,EX(ADX(ELAXMGUX))
          - condition: 
              exists: debug
              eval: ${debug}
            value: TEST
            
      # flag to perform linkedit
      - name: doLinkEdit
        value: true
        
      # default link edit parameters
      - name: linkEditParms
        value: MAP,RENT

      # build record output deploy type
      - name: deployType
        value: LOAD  # default value
        select:
          - condition: ${IS_CICS}
            value: CICSLOAD
          - condition: ${IS_DLI}
            value: IMSLOAD
          - condition: ${isIMS}
            value: IMSLOAD

      # flag to activate IMS options
      - name: isIMS
        value: false
        
      # default dependency search path for single repository build
      - name: dependencySearchPath
        value: search:${WORKSPACE}/?path=${APP_DIR_NAME}/copybook/*.cpy

      # flag incating to scan the load module for static link dependencies  
      - name: scanLoadModule
        value: true

      # instream variable to get the full hash of the commit in which the file was most recently updated
      - name: gitutil
        value: |1
            INCLUDE SYSLIB(${MEMBER})
            IDENTIFY ${MEMBER}('BR:${GIT_BRANCH} SHA:${GIT_HASH}')
            NAME ${MEMBER}(R)   

      # MQstub inclusion based on subsystem
      - name: mqCardBatch
        value: |1
            INCLUDE CSQSTUB(CSQBSTUB)
                   
      - name: mqCardCICS
        value: |1
            INCLUDE CSQSTUB(CSQCSTUB)
                   
      - name: mqCardIMS
        value: |1
            INCLUDE CSQSTUB(CSQQSTUB)        
        
      # Uncomment to resolve logical files using resolveSubsystems
      # - name: subsystemSearchPath
      #   value: ${dependencySearchPath}

    # datasets that need to be created / validated for this language configuration
    datasets:
      - name: ${HLQ}.COBOL
        options: cyl space(1,1) lrecl(80) dsorg(PO) recfm(F,B) dsntype(library)
      - name: ${HLQ}.COPY
        options: cyl space(1,1) lrecl(80) dsorg(PO) recfm(F,B) dsntype(library)
      - name: ${HLQ}.BMS.COPY
        options: cyl space(1,1) lrecl(80) dsorg(PO) recfm(F,B) dsntype(library)
      - name: ${HLQ}.DBRM
        options: cyl space(1,1) lrecl(80) dsorg(PO) recfm(F,B) dsntype(library)
      - name: ${HLQ}.OBJ
        options: cyl space(1,1) lrecl(80) dsorg(PO) recfm(F,B) dsntype(library)
      - name: ${HLQ}.LOAD
        options: cyl space(1,1) dsorg(PO) recfm(U) blksize(32760) dsntype(library)

    # list of steps to execute for each program processed by this language configuration
    steps:
    
      # Copy build file and dependency files to data sets
      - step: copySrc
        type: copy
        target: //'${HLQ}.COBOL(${MEMBER})'
        dependencyCopy:
          - search: ${dependencySearchPath}
            mappings:
              - source: "**/*"
                dataset: ${HLQ}.COPY
                
      # COBOL compile step          
      - step: compile
        type: mvs
        pgm: IGYCRCTL
        parm: ${compileParms}
        maxRC: 4
        dds:
          - { name: "SYSIN", dsn: "${HLQ}.COBOL(${MEMBER})", options: "shr", input: true }
          - { name: "SYSLIN", dsn: "${HLQ}.OBJ(${ENTRY})", options: "shr", output: true, deployType: "OBJ" }
          - { name: "TASKLIB", dsn: "${SIGYCOMP}", options: "shr" }
          - {                  dsn: "${SDFHLOAD}", condition: "${IS_CICS}", options: "shr" }
          - {                 dsn: "${SDSNLOAD}", condition: "${IS_SQL}", options: "shr" }
          - {                 dsn: "${SFELLOAD}", condition: { exists: "SFELLOAD" }, options: "shr" }
          - { name: "SYSPRINT", log: "${STEP}-${FILE_NAME}.log", logEncoding: "${LOG_ENCODING}", options: "cyl space(5,5) unit(vio) lrecl(133) recfm(f,b) new", logMode: "ASA_TEXT" }
          - { name: "SYSMDECK", options: "cyl space(5,5) unit(vio) lrecl(80) recfm(f,b) new" }
          - { name: "SYSUT1", options: "cyl space(5,5) unit(vio) lrecl(80) recfm(f,b) new" }
          - { name: "SYSUT2", options: "cyl space(5,5) unit(vio) lrecl(80) recfm(f,b) new" }
          - { name: "SYSUT3", options: "cyl space(5,5) unit(vio) lrecl(80) recfm(f,b) new" }
          - { name: "SYSUT4", options: "cyl space(5,5) unit(vio) lrecl(80) recfm(f,b) new" }
          - { name: "SYSUT5", options: "cyl space(5,5) unit(vio) lrecl(80) recfm(f,b) new" }
          - { name: "SYSUT6", options: "cyl space(5,5) unit(vio) lrecl(80) recfm(f,b) new" }
          - { name: "SYSUT7", options: "cyl space(5,5) unit(vio) lrecl(80) recfm(f,b) new" }
          - { name: "SYSUT8", options: "cyl space(5,5) unit(vio) lrecl(80) recfm(f,b) new"}
          - { name: "SYSUT9", options: "cyl space(5,5) unit(vio) lrecl(80) recfm(f,b) new" }
          - { name: "SYSUT10", options: "cyl space(5,5) unit(vio) lrecl(80) recfm(f,b) new" }
          - { name: "SYSUT11", options: "cyl space(5,5) unit(vio) lrecl(80) recfm(f,b) new" }
          - { name: "SYSUT12", options: "cyl space(5,5) unit(vio) lrecl(80) recfm(f,b) new" }
          - { name: "SYSUT13", options: "cyl space(5,5) unit(vio) lrecl(80) recfm(f,b) new" }
          - { name: "SYSUT14", options: "cyl space(5,5) unit(vio) lrecl(80) recfm(f,b) new" }
          - { name: "SYSUT15", options: "cyl space(5,5) unit(vio) lrecl(80) recfm(f,b) new" }
          - { name: "SYSUT16", options: "cyl space(5,5) unit(vio) lrecl(80) recfm(f,b) new" }
          - { name: "SYSUT17", options: "cyl space(5,5) unit(vio) lrecl(80) recfm(f,b) new" }
          - { name: "SYSLIB", dsn: "${HLQ}.COPY", options: "shr" }
          - {                 dsn: "${HLQ}.BMS.COPY", options: "shr" }
          - {                 dsn: "${SDFHCOB}", condition: "${IS_CICS}", options: "shr" }
          - {                 dsn: "${SCSQCOBC}", condition: "${IS_MQ}", options: "shr" }
          - {                 dsn: "${SCEESAMP}", options: "shr" }
          - { name: "DBRMLIB", dsn: "${HLQ}.DBRM(${MEMBER})", condition: "${IS_SQL}", options: "shr", output: true, deployType: "DBRM" }          
          - { name: "SYSADATA", condition: { exists: "errPrefix" }, options: "DUMMY" }
          - { name: "SYSXMLSD", condition: { exists: "errPrefix" }, dsn: "${HLQ}.${errPrefix}.SYSXMLSD.XML", options: "tracks space(200,40) dsorg(PS) lrecl(16383) recfm(v,b) new keep" }

      # Custom script to populate the variables to store git metadata. Ensure your Groovy script is located in $DBB_BUILD/groovy.
      - step: GitUtils
        type: task
        script: groovy/gitUtilsTask.groovy      

      # Link-Edit step
      - step: linkEdit
        type: mvs
        pgm: IEWBLINK
        parm: ${linkEditParms}
        condition: ${doLinkEdit}
        maxRC: 0
        dds:
          - { name: "SYSREF", instream: "${mqCardCICS}", condition: "${IS_CICS} && ${IS_MQ}", options: "tracks space(5,5) unit(vio) blksize(80) lrecl(80) recfm(f,b) new" }
          - { name: "SYSREF", instream: "${mqCardIMS}", condition: "${IS_DLI} && ${IS_MQ}", options: "tracks space(5,5) unit(vio) blksize(80) lrecl(80) recfm(f,b) new" }
          - { name: "SYSREF", instream: "${mqCardBatch}", condition: "${IS_CICS} != true && ${IS_DLI} != true && ${IS_MQ}", options: "tracks space(5,5) unit(vio) blksize(80) lrecl(80) recfm(f,b) new" }
          - { name: "SYSREF", condition: "${LIFECYCLE} != 'user'", instream: "${gitutil}", options: "tracks space(5,5) unit(vio) blksize(80) lrecl(80) recfm(f,b) new" }  
          - { name: "SYSLIN", dsn: "${HLQ}.OBJ(${ENTRY})", options: "shr" }
          - { ref: "SYSREF", condition: "${LIFECYCLE} != 'user'" }
          - { ref: "SYSREF", condition: "${IS_MQ}" }
          - { name: "SYSLMOD", dsn: "${HLQ}.LOAD(${ENTRY})", options: "shr", output: true, deployType: "${deployType}", scan: "${scanLoadModule}" }
          - { name: "SYSPRINT", log: "${STEP}-${FILE_NAME}.log", logEncoding: "${LOG_ENCODING}", options: "cyl space(5,5) unit(vio) lrecl(133) recfm(f,b) new", logMode: "ASA_TEXT" }
          - { name: "SYSUT1", options: "cyl space(5,5) unit(vio) lrecl(80) recfm(f,b) new" }
          - { name: "RESLIB", condition: { exists: RESLIB }, options: "shr" }
          - { name: "SYSLIB", dsn: "${HLQ}.OBJ", options: "shr" }
          - {                 dsn: "${SCEELKED}", options: "shr" }
          - {                 dsn: "${SDFHLOAD}", condition: "${IS_CICS}", options: "shr" }
          - {                 dsn: "${SDSNLOAD}", condition: "${IS_SQL}", options: "shr" }
          - { name: "CSQSTUB", dsn: "${SCSQLOAD}", condition: "${IS_MQ}", options: "shr" }
